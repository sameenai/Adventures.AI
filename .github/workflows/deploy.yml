# Continuous deploy to Cloud Run on merge to main.
#
# ACTIVATION (one-time, by a repo admin):
#   1. Create a Workload Identity Federation provider for GitHub Actions in
#      GCP project basecamp-494710 and a deploy service account with
#      roles/run.admin + roles/cloudbuild.builds.editor + roles/iam.serviceAccountUser.
#   2. Set repository variables:
#        GCP_WIF_PROVIDER  — projects/…/locations/global/workloadIdentityPools/…/providers/…
#        GCP_DEPLOY_SA     — deploy-sa@basecamp-494710.iam.gserviceaccount.com
#   Until those variables exist this workflow skips itself; `make deploy-gcp`
#   remains the manual path.
name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    if: ${{ vars.GCP_WIF_PROVIDER != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: summit-social
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build image (tagged with the commit SHA, not :latest)
        run: >-
          gcloud builds submit .
          --project=basecamp-494710
          --tag=europe-west2-docker.pkg.dev/basecamp-494710/basecamper/app:${{ github.sha }}

      - name: Run database migrations
        run: |
          gcloud run jobs update migrate-db \
            --project=basecamp-494710 --region=europe-west2 \
            --image=europe-west2-docker.pkg.dev/basecamp-494710/basecamper/app:${{ github.sha }} \
            --command=npx --args=prisma,migrate,deploy --quiet
          gcloud run jobs execute migrate-db \
            --project=basecamp-494710 --region=europe-west2 --wait

      # Canary: the new revision comes up with zero traffic behind a tagged
      # URL, gets smoke-tested there, and only then takes live traffic. A
      # failed smoke leaves production untouched on the previous revision.
      - name: Deploy canary revision (no traffic)
        run: >-
          gcloud run deploy basecamper
          --project=basecamp-494710
          --region=europe-west2
          --image=europe-west2-docker.pkg.dev/basecamp-494710/basecamper/app:${{ github.sha }}
          --no-traffic
          --tag=canary
          --quiet

      - name: Smoke test the canary
        run: |
          CANARY_URL=$(gcloud run services describe basecamper \
            --project=basecamp-494710 --region=europe-west2 --format=json \
            | jq -r '.status.traffic[] | select(.tag=="canary") | .url')
          echo "Canary URL: $CANARY_URL"
          test -n "$CANARY_URL"
          # Health must pass (DB + Redis reachable from the new revision) and
          # the critical pages must render inside the 5s smoke budget.
          curl -sf --max-time 5 "$CANARY_URL/api/health" | jq -e '.status == "ok"'
          curl -sf --max-time 5 -o /dev/null -w "GET / -> %{http_code} in %{time_total}s\n" "$CANARY_URL/"
          curl -sf --max-time 5 -o /dev/null -w "GET /adventures -> %{http_code} in %{time_total}s\n" "$CANARY_URL/adventures"
          # CSP nonce round-trip: header and body MUST come from the same
          # response (the nonce is per-request). A page whose scripts don't
          # carry the response's nonce ships with all JavaScript blocked —
          # exactly the failure a plain 200 check cannot see.
          for PAGE in / /login; do
            curl -sf --max-time 5 -D /tmp/smoke-headers.txt -o /tmp/smoke-body.html "$CANARY_URL$PAGE"
            NONCE=$(tr -d '\r' < /tmp/smoke-headers.txt | grep -i '^content-security-policy:' | sed -n "s/.*'nonce-\([^']*\)'.*/\1/p")
            test -n "$NONCE" || { echo "FAIL: no CSP nonce in headers for $PAGE"; exit 1; }
            COUNT=$(grep -c "nonce=\"$NONCE\"" /tmp/smoke-body.html || true)
            echo "GET $PAGE -> $COUNT nonced script/style tags"
            test "$COUNT" -gt 0 || { echo "FAIL: $PAGE served HTML without the response nonce — scripts would be CSP-blocked"; exit 1; }
          done

      - name: Promote canary to live traffic
        run: >-
          gcloud run services update-traffic basecamper
          --project=basecamp-494710
          --region=europe-west2
          --to-latest
          --quiet
